[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-match-doctor"
version = "1.0.0"
description = "Reconcile a broker rate confirmation against the carrier invoice, line by line"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
rate-match-doctor = "rate_match_doctor:main_entry"

[tool.setuptools]
py-modules = ["rate_match_doctor"]
